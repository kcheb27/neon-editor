<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: neon-plugin:; frame-src neon-plugin:; worker-src 'self' blob:; connect-src 'self' ws:"
    />
    <title>Neon Editor</title>
    <!-- Boot screen: plain HTML/CSS so it paints before the app's script has loaded.
         The app replaces #app's contents when it is ready. -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #10121a; color: #e4e7f2; font: 13px/1.4 'Segoe UI', system-ui, sans-serif; animation: boot-in 0.25s ease-out; }
      .boot-title { font-size: 26px; font-weight: 300; letter-spacing: 0.02em; }
      .boot-title b { font-weight: 700; background: linear-gradient(90deg, #7c5cff, #4fd6ff, #ff5fa2); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .boot-bar { width: 180px; height: 3px; border-radius: 2px; background: #1c1f2b; overflow: hidden; position: relative; }
      .boot-bar::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 2px;
        background: linear-gradient(90deg, transparent, #7c5cff, #4fd6ff, transparent); animation: boot-slide 1.1s ease-in-out infinite; }
      .boot-status { color: #8a93b0; font-size: 12px; min-height: 1.4em; }
      @keyframes boot-slide { from { left: -40%; } to { left: 100%; } }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot, .boot-bar::after { animation: none; } .boot-bar::after { left: 30%; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-title">Neon <b>Editor</b></div>
        <div class="boot-bar"></div>
        <div class="boot-status" id="boot-status">Starting…</div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
